# Every pull request and every push to main.
#
# CI holds NO production secrets (09 §9.9) and deploys nothing: it proves the
# workspace is green, the images build, and the production release path works
# against a real Postgres 16 with a non-superuser migrator.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  workspace:
    name: typecheck, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: money lint (ADR-0004)
        run: node tools/lint-money.mjs
      - name: payroll boundary lint (CLAUDE.md §2.4)
        run: node tools/lint-payroll.mjs
      # Concurrency capped at 2: each PGlite suite runs its own Postgres-in-wasm
      # and the hosted runner has 4 vCPUs. (The web UI flake that first motivated
      # this is fixed at the source — apps/web/tests/setup/async-timeout.ts — so
      # the cap is now sizing, not a workaround.)
      - name: typecheck and test (the three mandatory categories run here)
        run: pnpm exec turbo run typecheck test --concurrency=2
      - name: build
        run: pnpm build
      - name: release path against real Postgres 16
        run: infra/scripts/release-smoke.sh

  # The PWA in a real browser (apps/web/playwright.config.ts): Chromium at the
  # three form factors ADR-0003 A1 names. Builds its own two bundles — the
  # e2e seam build and a production build the guard greps — so it does not
  # depend on the workspace job's dist/. No secrets, no stack: the API is
  # Playwright routes on a reserved .invalid origin; PowerSync is unreachable.
  browser:
    name: browser tests (tablet, laptop, phone)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install Chromium (Android Chrome is Chromium; iOS is not a target)
        run: pnpm --filter @erp/web exec playwright install --with-deps chromium
      - name: build the e2e and guard bundles, serve with vite preview, run
        run: pnpm --filter @erp/web e2e
      - name: keep the report and traces when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  images:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: api image (also the migrator and the worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          build-args: ERP_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: powersync image (pinned service + baked sync rules)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/powersync.Dockerfile
          push: false
      - name: web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: true
          tags: erp-web:ci
          build-args: |
            VITE_API_URL=https://api.ci.invalid
            VITE_POWERSYNC_URL=https://sync.ci.invalid
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: web nginx config renders and validates
        run: docker run --rm erp-web:ci nginx -t
