# Every pull request and every push to main.
#
# CI holds NO production secrets (09 §9.9) and deploys nothing: it proves the
# workspace is green, the images build, and the production release path works
# against a real Postgres 16 with a non-superuser migrator.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  workspace:
    name: typecheck, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: money lint (ADR-0004)
        run: node tools/lint-money.mjs
      - name: payroll boundary lint (CLAUDE.md §2.4)
        run: node tools/lint-payroll.mjs
      # Concurrency capped: each PGlite suite forks its own Postgres-in-wasm,
      # and apps/web's office-shell UI test times out (findBy*, 1 s) when every
      # suite runs at once — it passes alone. Fix the test's timeouts, then lift this.
      - name: typecheck and test (the three mandatory categories run here)
        run: pnpm exec turbo run typecheck test --concurrency=2
      - name: build
        run: pnpm build
      - name: release path against real Postgres 16
        run: infra/scripts/release-smoke.sh

  images:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api image (also the migrator and the worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          build-args: ERP_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: powersync image (pinned service + baked sync rules)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/powersync.Dockerfile
          push: false
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: true
          tags: erp-web:ci
          build-args: |
            VITE_API_URL=https://api.ci.invalid
            VITE_POWERSYNC_URL=https://sync.ci.invalid
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: web nginx config renders and validates
        run: docker run --rm erp-web:ci nginx -t
