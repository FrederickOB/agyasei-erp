# Keep the hosted POC's API awake through the trading day.
#
# The POC runs on Render's FREE plan (render.yaml), which puts the API to sleep
# after 15 minutes without a request and takes ≈30 s to answer the first one
# after that (measured 25 Nov 2026: 30.1 s cold, 0.5 s warm). A tablet needs
# that API to reconnect its sync stream, so every morning and every wake from
# a long idle spell sat ≈30 s on "Connecting" before anything synced.
#
# One request every 10 minutes keeps it warm. Only 05:00–21:59 UTC (Ghana is
# UTC+0 all year), not round the clock: ≈17 h a day is ≈530 of the free plan's
# 750 instance-hours a month, leaving room for anything else on the account.
# /readyz also touches the database, which keeps the free Supabase project
# from pausing for inactivity.
#
# Free for a public repository. Deploys nothing and holds no secrets. GitHub
# runs schedules best-effort (a run can be late) and only from the default
# branch, and pauses scheduled workflows in a repository with no activity for
# 60 days. Set the repository variable POC_API_URL if the API moves.
name: keep-poc-awake

on:
  schedule:
    - cron: '*/10 5-21 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-poc-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /readyz
        env:
          POC_API_URL: ${{ vars.POC_API_URL }}
        run: |
          url="${POC_API_URL:-https://erp-poc-api.onrender.com}"
          curl --silent --show-error --fail --max-time 120 --retry 2 --retry-delay 5 \
            --output /dev/null --write-out "readyz %{http_code} in %{time_total}s\n" \
            "${url%/}/readyz"
