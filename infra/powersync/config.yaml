# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# PowerSync service configuration — LOCAL DEV ONLY.
# Values marked !env are substituted from PS_-prefixed environment variables
# set in infra/docker-compose.yml (which in turn takes them from the
# `pnpm stack:up` wrapper / infra/.env.example).

_type: self-hosted

telemetry:
  disable_telemetry_sharing: true

# Source database replication: the erp Postgres, reached in-network as
# postgres:5432 (the SAME container that is localhost:5433 on the host).
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable # dev-only, private compose network

# Sync-bucket storage: Postgres storage (open edition, service >= 1.3.8) in a
# DEDICATED database (powersync_storage) on the same dev cluster — no MongoDB
# container needed. The service creates and owns a `powersync` schema there.
storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

# The PowerSync API/sync port — fixed by the environment contract at 8080.
port: 8080

# THE isolation boundary: bucket definitions live in their own reviewed file.
sync_config:
  path: /config/sync_rules.yaml

# Client (device) authentication — TWO key sources, one audience each.
#
# PRODUCTION PATH (02-security §2.2): ES256 sync tokens minted by the API's
# GET /sync/token for an enrolled device's session, audience "erp-sync",
# verified against the API's PUBLIC keys at its JWKS endpoint. Key rotation
# is the API's (prepend a key in ERP_SIGNING_JWKS; the old one keeps
# verifying until its tokens expire) and needs no change here.
#   PS_JWKS_URI  e.g. https://api.<platform>/.well-known/jwks.json in
#                production; in dev the API on the host, reached from the
#                container (default in docker-compose.yml).
# block_local_jwks: false is DEV ONLY — PowerSync refuses a JWKS URI on a
# private address by default, and in dev the API is on the host. Production
# serves the JWKS on a public URL and MUST leave the default (true).
#
# DEV PATH: the one HS256 dev secret, env DEV_JWT_SECRET (default
# "dev-secret-change-me"), audience "powersync". PS_JWT_K is
# base64url(DEV_JWT_SECRET), derived by infra/scripts/stack.mjs. Production
# config carries NO oct key — the dev path must not exist there.
#
# Either way the token must carry tid, sub and did: every parameter query
# keys on all three (sync_rules.yaml, migration 0024).
client_auth:
  jwks_uri: !env PS_JWKS_URI
  block_local_jwks: false
  jwks:
    keys:
      - kty: 'oct'
        alg: 'HS256'
        k: !env PS_JWT_K
  audience: ['powersync', 'erp-sync']

# Local admin/diagnostics API token (dev only).
api:
  tokens:
    - erp_dev_admin_token

system:
  logging:
    level: info
    format: text
