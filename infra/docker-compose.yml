# Local sync stack — dev only (docs/architecture/sections/03-offline-sync.md).
#
#   postgres   localhost:5433  Postgres 16, wal_level=logical (NOT the host's PG14 on 5432)
#   powersync  localhost:8080  PowerSync service (open edition), Postgres bucket storage
#
# Bring it up with `pnpm stack:up` from the repo root — NOT bare `docker compose up`:
# the wrapper derives PS_JWT_K (base64url of DEV_JWT_SECRET) and runs the DB
# bootstrap (migrations, publication, two seeded tenants) between the two
# services, because PowerSync needs the `powersync` publication to exist.
#
# Dev credentials in this file (erp_dev, powersync_dev) are throwaway local
# defaults, mirrored in .env.example. Real secrets are never committed.

name: erp-dev-stack

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev}
      POSTGRES_DB: erp
    ports:
      - "5433:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data
      # First-boot-only init: replication + storage roles, powersync_storage db.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 12

  powersync:
    # Pinned: :latest of 2026-08 is 1.24.0. Postgres bucket storage needs >= 1.3.8;
    # /probes/* healthcheck needs >= 0.5.8.
    image: journeyapps/powersync-service:1.24.0
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
      # Replication source: the erp database, in-network hostname postgres:5432.
      PS_DATA_SOURCE_URI: postgresql://powersync_repl:${POWERSYNC_REPL_PASSWORD:-powersync_dev}@postgres:5432/erp
      # Bucket storage: separate database, same dev cluster (allowed on PG >= 14).
      PS_STORAGE_URI: postgresql://powersync_storage:${POWERSYNC_STORAGE_PASSWORD:-powersync_dev}@postgres:5432/powersync_storage
      # base64url(DEV_JWT_SECRET) — derived by infra/scripts/stack.mjs, never hand-typed.
      PS_JWT_K: ${PS_JWT_K:?run via pnpm stack:up / stack:reset so PS_JWT_K is derived from DEV_JWT_SECRET}
      NODE_OPTIONS: --max-old-space-size=1000
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  erp_pg_data:
